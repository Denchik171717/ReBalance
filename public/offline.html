<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PsychoHelp - Офлайн</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 400px;
      }

      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        opacity: 0.9;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 12px;
      }

      p {
        font-size: 16px;
        opacity: 0.9;
        line-height: 1.5;
        margin-bottom: 32px;
      }

      button {
        background: white;
        color: #667eea;
        border: none;
        padding: 14px 32px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
      }

      button:hover {
        transform: scale(1.05);
      }

      button:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 1h15M1 7h15M1 13h15"></path>
        <path d="M16 1l5 5-5 5M21 1v18a2 2 0 01-2 2H5a2 2 0 01-2-2V1"></path>
      </svg>
      <h1>Нет подключения к интернету</h1>
      <p>Кажется, вы офлайн. Проверьте подключение к сети и попробуйте снова.</p>
      <button onclick="window.location.reload()">Попробовать снова</button>
    </div>
  </body>
</html>
